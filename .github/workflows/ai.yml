name: Update AI Rules

on:
  schedule:
    # 每周一凌晨 4:17（北京时间）
    - cron: "17 4 * * 1"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout subscribe repo
        uses: actions/checkout@v5

      - name: Download source ai.list
        run: |
          curl -fSL --retry 3 --connect-timeout 10 --max-time 60 \
            "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/mihomo-ruleset/ai.list" \
            -o ai-source.list

      - name: Download source TikTok.list
        run: |
          curl -fSL --retry 3 --connect-timeout 10 --max-time 60 \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list" \
            -o TikTok-source.list

      - name: Validate source and generate filtered rules
        shell: python
        run: |
          import re
          from pathlib import Path

          label = r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?"
          domain_pattern = re.compile(rf"(?:{label}\.)+{label}")
          source_rules = []

          # 先校验所有上游条目，避免空文件或错误页面被当作规则提交。
          source = Path("ai-source.list").read_text(encoding="utf-8-sig")
          for line_number, line in enumerate(source.splitlines(), 1):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              for entry in line.split():
                  suffix = entry.startswith("+.")
                  domain = entry[2:] if suffix else entry
                  if (
                      len(domain) > 253
                      or not domain_pattern.fullmatch(domain)
                      or domain.rsplit(".", 1)[-1].isdigit()
                  ):
                      raise SystemExit(f"上游第 {line_number} 行包含无效域名：{entry!r}")
                  rule_type = "DOMAIN-SUFFIX" if suffix else "DOMAIN"
                  source_rules.append((rule_type, domain))

          if not source_rules:
              raise SystemExit("上游没有有效域名，停止更新。")

          # 保留现有 aws/amazon 关键字过滤和首次出现顺序。
          rules = []
          seen = set()
          for rule_type, domain in source_rules:
              if re.search(r"aws|amazon", domain, re.IGNORECASE):
                  continue
              rule = f"{rule_type},{domain}"
              if rule not in seen:
                  seen.add(rule)
                  rules.append(rule)

          if not rules:
              raise SystemExit("上游规则过滤后为空，停止更新。")

          # 自定义 Google 规则仅精确匹配 www.google.com。
          custom_rule = "DOMAIN,www.google.com"
          if custom_rule not in seen:
              seen.add(custom_rule)
              rules.append(custom_rule)

          # TikTok 保留完整匹配类型，合并到 AI 规则并按首次出现顺序去重。
          allowed_types = {"DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD", "PROCESS-NAME"}
          tiktok_rules = []
          tiktok_source = Path("TikTok-source.list").read_text(encoding="utf-8-sig")
          for line_number, line in enumerate(tiktok_source.splitlines(), 1):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              parts = line.split(",")
              if (
                  len(parts) != 2
                  or parts[0] not in allowed_types
                  or not parts[1]
                  or any(char.isspace() or ord(char) < 32 for char in parts[1])
              ):
                  raise SystemExit(f"TikTok 上游第 {line_number} 行包含无效规则：{line!r}")
              rule_type, value = parts
              if rule_type in {"DOMAIN", "DOMAIN-SUFFIX"} and (
                  len(value) > 253
                  or not domain_pattern.fullmatch(value)
                  or value.rsplit(".", 1)[-1].isdigit()
              ):
                  raise SystemExit(f"TikTok 上游第 {line_number} 行包含无效域名：{value!r}")
              tiktok_rules.append(line)

          if not tiktok_rules:
              raise SystemExit("TikTok 上游没有有效规则，停止更新。")

          for rule in tiktok_rules:
              if rule not in seen:
                  seen.add(rule)
                  rules.append(rule)

          Path("ai-rules.list").write_text("\n".join(rules) + "\n", encoding="utf-8")
          print(f"过滤后规则数量：{len(rules)}")

      - name: Generate ai.list
        run: |
          cp ai-rules.list ai.list

          echo "ai.list 前 20 行："
          head -n 20 ai.list

      - name: Generate ai.yaml
        run: |
          {
            echo "payload:"
            sed 's/^/  - /' ai-rules.list
          } > ai.yaml

          echo "ai.yaml 前 20 行："
          head -n 20 ai.yaml

      - name: Commit and push
        run: |
          rm -f ai-source.list ai-rules.list TikTok-source.list

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ai.list ai.yaml

          if git diff --cached --quiet; then
            echo "ai.list 和 ai.yaml 没有变化，不提交。"
          else
            git commit -m "update ai rules"
            git push
          fi
